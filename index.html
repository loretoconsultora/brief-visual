<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brief Visual · Loreto Consultora</title>
<meta name="description" content="Brief visual de Loreto Consultora: colores, tipografías y estilo para construir tu marca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Permanent+Marker&family=Playfair+Display:wght@500&family=Chewy&family=Great+Vibes&family=Raleway:wght@200&family=Orbitron:wght@800&family=Questrial&family=UnifrakturMaguntia&family=Caveat:wght@500&family=Alfa+Slab+One&family=Bebas+Neue&family=Bungee+Inline&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#F393AE; --pink-soft:#FDE7EE; --teal:#67C6C8; --teal-dark:#3EA9AB; --teal-soft:#E1F4F4;
  --yellow:#FCCD0D; --yellow-soft:#FFF5CC; --ink:#1D1D1F; --text:#3A3A3C; --muted:#6E6E73;
  --line:#E5E5EA; --bg:#FFFFFF; --card:#FFFFFF; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
.deco{position:fixed;border-radius:50%;z-index:0;pointer-events:none;transition:opacity .4s}
.deco.d1{width:260px;height:260px;background:var(--pink);right:-150px;top:-150px}
.deco.d2{width:70px;height:70px;background:var(--yellow);right:60px;top:70px}
.deco.d3{width:160px;height:160px;background:var(--teal);right:-60px;bottom:-90px;border-radius:50% 50% 0 0}
body:not(.intro) .deco{opacity:0}
@media (min-width:900px){body:not(.intro) .deco{opacity:1}}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 16px 120px}
.brand{font-weight:700;color:var(--ink);font-size:15px;letter-spacing:.2px}
.progress{margin:22px 0 6px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--teal));transition:width .35s}
.steplabel{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.kicker{color:var(--teal-dark);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600;margin:40px 0 8px}
h1{font-size:clamp(30px,7vw,46px);line-height:1.08;color:var(--ink);margin:0 0 14px;font-weight:700}
h2{font-size:clamp(22px,5vw,28px);color:var(--ink);margin:28px 0 6px;font-weight:700;line-height:1.2}
.lead{font-size:16px;line-height:1.6;max-width:580px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:18px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.q h3{margin:0 0 4px;font-size:16px;color:var(--ink);font-weight:600;line-height:1.35}
.q .hint{margin:0 0 14px;font-size:13px;color:var(--muted)}
.req{color:var(--pink)}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;background:#fff;outline:none;transition:border .2s}
.field:focus{border-color:var(--teal)}
textarea.field{min-height:110px;resize:vertical}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.g2.pal{grid-template-columns:1fr}}
.opt{position:relative;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s,transform .1s;display:flex;flex-direction:column;gap:10px;min-height:52px}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:700}
.opt.avoid[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px #e5e5ea}
.opt.avoid[aria-pressed="true"]::after{content:"✕";background:var(--ink)}
.opt .lbl{font-size:14px;font-weight:500;color:var(--ink)}
.opt .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.sw{display:flex;height:44px;border-radius:8px;overflow:hidden}
.sw i{flex:1}
.sw.sm{height:22px}
.font-sample{font-size:30px;line-height:1.1;color:var(--ink);min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 2px;overflow:hidden;word-break:break-word}
.counter{font-size:12px;color:var(--teal-dark);font-weight:600;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.scale{margin:14px 0 20px}
.scale .ends{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:8px;gap:12px}
.scale .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .dot{height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--muted);transition:all .15s}
.scale .dot[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.shape{height:56px;display:flex;align-items:center;justify-content:center}
.shape svg{width:100%;max-width:120px;height:56px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:12px;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:999px;padding:14px 24px;font-weight:600;font-size:15px;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.accent{background:var(--pink);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.err{color:#C2185B;font-size:13px;margin-top:8px;display:none}
.err.show{display:block}
.step{display:none;animation:fade .3s ease}
.step.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.saved{font-size:12px;color:var(--muted)}
/* summary */
.sum-sec{border-top:1px solid var(--line);padding:16px 0}
.sum-sec h4{margin:0 0 8px;font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--teal-dark)}
.sum-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0;font-size:14px}
.sum-k{color:var(--muted);min-width:220px}
@media (max-width:560px){.sum-k{min-width:100%}}
.sum-v{color:var(--ink);font-weight:500;flex:1}
.tag{display:inline-block;background:var(--teal-soft);color:#1f6f71;border-radius:999px;padding:4px 10px;font-size:12px;margin:2px 4px 2px 0}
.tag.no{background:#f2f2f4;color:var(--ink);text-decoration:line-through}
.sum-pal{display:inline-flex;flex-direction:column;gap:4px;margin:4px 10px 8px 0;width:120px}
.sum-pal span{font-size:12px;color:var(--ink)}
.sum-font{display:inline-block;margin:4px 14px 4px 0;font-size:24px;color:var(--ink)}
.done-box{background:var(--yellow-soft);border-radius:var(--radius);padding:18px;margin:20px 0}
.print-only{display:none}
@media print{
  @page{size:letter;margin:14mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .deco,.nav,.progress,.steplabel,.no-print,.step:not(#step-summary){display:none!important}
  #step-summary{display:block!important;animation:none}
  .app{padding:0;max-width:none}
  .print-only{display:block}
  .sum-sec{break-inside:avoid}
  h1{font-size:28px}
}
</style>
</head>
<body>
<div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div>
<main class="app">
  <div class="brand">Loreto Consultora</div>
  <div class="progress no-print"><i id="bar"></i></div>
  <div class="steplabel" id="steplabel"></div>
  <form id="form" autocomplete="on" onsubmit="return false"></form>
</main>
<nav class="nav no-print">
  <div class="in">
    <button class="btn ghost" id="prev" type="button">Atrás</button>
    <span class="saved" id="saved"></span>
    <button class="btn primary" id="next" type="button">Comenzar</button>
  </div>
</nav>

<script>
/* ---------- Data ---------- */
const PALETTES = [
  ["Rojos",["#FF190C","#400604","#E5150B","#BF1309","#7F0C07"]],
  ["Naranjas",["#FF8621","#E86A20","#FF672E","#E74320","#FE3523"]],
  ["Fucsias",["#FF00B3","#CB008F","#E6009F","#7F0059","#FF3DC5"]],
  ["Rosas",["#C7897C","#E8A091","#F5B99D","#FCE8CD","#FFDECB"]],
  ["Morados",["#4F1480","#C174FE","#A029FF","#603B80","#7E20CC"]],
  ["Azules",["#0065FF","#00AAFF","#0123FF","#0087FA","#0046FE"]],
  ["Azules rey",["#012466","#0056F3","#013BA6","#0140B2","#00328B"]],
  ["Azules marino",["#0C1F57","#021442","#1C3973","#1051A3","#164597"]],
  ["Celestes",["#2F4159","#8698A6","#E4EBF3","#F5F4F2","#C6D3E4"]],
  ["Turquesas",["#4D9E97","#2D5E5A","#6ADED5","#71EBE0","#5FC4BC"]],
  ["Verdes",["#08A607","#098C02","#025A03","#004003","#012501"]],
  ["Verdes limón",["#8FBF1D","#5F7F12","#BFFF25","#2F4009","#ACE622"]],
  ["Verdes hoja",["#BBF2C8","#69A658","#5F8C51","#3C592D","#C4F1AE"]],
  ["Amarillos",["#FFEF2F","#E8C72A","#FEC93B","#E8A12B","#FF9630"]],
  ["Dorados",["#D4B711","#7F6F00","#FEDC00","#403700","#E6C601"]],
  ["Cafés",["#050507","#9D772C","#735823","#402E1A","#703D1E"]],
  ["Cafés claros",["#C4812A","#B88043","#C78632","#D09342","#A96828"]],
  ["Neutros (blanco, gris y negro)",["#8B8C7E","#C2C3B1","#000000","#32332E","#F0F2DA"]]
];
const FONTS = [
  ["Brocha","'Permanent Marker'","BROCHA",""],
  ["Clásica","'Playfair Display'","Clásica","font-weight:500"],
  ["Divertida","Chewy","¡Divertida!",""],
  ["Elegante","'Great Vibes'","Elegante","font-size:38px"],
  ["Fina","Raleway","FINA","font-weight:200;letter-spacing:4px"],
  ["Futurista","Orbitron","FUTURISTA","font-weight:800;font-size:22px"],
  ["Geométrica","Questrial","Geométrica",""],
  ["Gótica","'UnifrakturMaguntia'","Gótica",""],
  ["Manuscrita","Caveat","Manuscrita","font-size:34px"],
  ["Masculina","'Alfa Slab One'","Masculina","font-size:26px"],
  ["Moderna","'Bebas Neue'","MODERNA","font-size:38px;letter-spacing:1px"],
  ["Retro","'Bungee Inline'","RETRO","font-size:30px"],
  ["Suave","Pacifico","Suave",""]
];
const TEMPS = ["Clara y luminosa","Vibrante y saturada","Pastel y suave","Terrosa y natural","Oscura y profunda","Neutra y sobria"];
const SCALES = [
  ["calido","Cálida","Sobria"],
  ["minimal","Minimalista","Con detalle"],
  ["moderno","Moderna","Clásica"],
  ["serio","Seria","Divertida"],
  ["emocional","Emocional","Racional"],
  ["cercano","Cercana","Institucional"],
  ["accesible","Accesible","Premium / exclusiva"]
];
const SHAPES = [
  ["Orgánicas y fluidas",'<path d="M5 40 C25 5 45 55 65 25 S100 10 115 35" fill="none" stroke="#F393AE" stroke-width="6" stroke-linecap="round"/>'],
  ["Redondeadas y amables",'<circle cx="35" cy="28" r="20" fill="#67C6C8"/><rect x="64" y="8" width="44" height="40" rx="16" fill="#FCCD0D"/>'],
  ["Geométricas y precisas",'<rect x="10" y="10" width="36" height="36" fill="#1D1D1F"/><circle cx="84" cy="28" r="19" fill="none" stroke="#1D1D1F" stroke-width="5"/>'],
  ["Angulosas y dinámicas",'<polygon points="8,48 38,8 58,48" fill="#F393AE"/><polygon points="62,8 112,20 78,50" fill="#3EA9AB"/>'],
  ["Líneas finas y trazos",'<path d="M8 44 L40 12 M30 44 L62 12 M52 44 L84 12 M74 44 L106 12" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round"/>']
];
const FINISHES = ["Colores planos y sólidos","Degradados","Texturas (papel, grano, lienzo)","Trazos hechos a mano","Mucho espacio en blanco","Patrones y repeticiones"];
const IMGTYPES = ["Fotografía real","Ilustración","Íconos y gráficos simples","Mezcla de foto e ilustración"];
const LIGHTS = [["Cálida","tonos dorados, atardecer"],["Natural","luz de día, colores reales"],["Fría","tonos azulados, limpia"],["Contrastada","sombras marcadas, dramática"]];
const PEOPLE = ["Muchas personas, en momentos reales","Algunas personas, sin ser protagonistas","Prefiero objetos, espacios y detalles"];
const APPEAR = ["Sí, quiero ser la cara de la marca","Sí, de vez en cuando","Prefiero no aparecer","Aún no lo sé"];
const FORMATS = ["Fotografías","Video hablando a cámara","Reels o videos cortos","Transmisiones en vivo","Voz en off, sin mostrar el rostro","Ninguno por ahora"];
const LOOKS = ["Cercana y casual","Profesional y formal","En mi espacio de trabajo","Al aire libre","Acompañando a otras personas","En mi día a día"];
const MATERIAL = ["Fotos profesionales","Fotos casuales de buena calidad","Videos","Un logo o identidad actual","Nada todavía"];
const LANGS = ["Español","Inglés","Bilingüe (español e inglés)","Otro"];
const APPS = ["Foto de perfil y portadas para redes sociales","Plantillas para publicaciones","Plantillas para historias","Portadas y textos para reels o videos","Firma de correo electrónico","Presentaciones (charlas, talleres, propuestas)","Formatos para clientes o pacientes (fichas, consentimientos, recordatorios)","Página web","Tarjeta de presentación digital","Tarjeta de presentación impresa","Papelería (hojas membretadas, recibos)","Promocionales impresos"];

/* ---------- State ---------- */
const KEY = "loreto-brief-visual-v1";
const blank = {nombre:"",marca:"",correo:"",colores:[],evitar:[],temps:[],fuentes:[],escalas:{},formas:[],acabados:[],imagen:[],luz:"",personas:"",aparecer:"",formatos:[],verse:[],material:[],imagenPersonal:"",idioma:"",idiomaOtro:"",apps:[],appsOtro:"",referencias:"",comentarios:""};
let S = load();
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d) return Object.assign(structuredClone(blank),d);}catch(e){} return structuredClone(blank); }
let saveT; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem(KEY,JSON.stringify(S)); flash("Guardado");}catch(e){} },250); }
function flash(t){ const el=document.getElementById("saved"); el.textContent=t; clearTimeout(el._t); el._t=setTimeout(()=>el.textContent="",1400); }
const qp = new URLSearchParams(location.search); if(qp.get("marca") && !S.marca) S.marca = qp.get("marca");

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const swatch = (cols,cls="") => `<div class="sw ${cls}">${cols.map(c=>`<i style="background:${c}"></i>`).join("")}</div>`;
function q(title,hint,body,req,id){ return `<div class="q" ${id?`id="${id}"`:""}><h3>${title}${req?' <span class="req">*</span>':''}</h3>${hint?`<p class="hint">${hint}</p>`:""}${body}<div class="err"></div></div>`; }
function multi(key,items,{max=0,cols="g2",render,avoid=false}={}){
  return `<div class="grid ${cols}" data-multi="${key}" data-max="${max}">${items.map((it,i)=>{const v=Array.isArray(it)?it[0]:it;return `<button type="button" class="opt ${avoid?"avoid":""}" data-v="${esc(v)}" aria-pressed="${S[key].includes(v)}">${render?render(it,i):`<span class="lbl">${esc(v)}</span>`}</button>`}).join("")}</div>${max?`<div class="counter" data-count="${key}"></div>`:""}`;
}
function chips(key,items,single){ return `<div class="chips" data-${single?"single":"multi"}="${key}">${items.map(v=>`<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${single?S[key]===v:S[key].includes(v)}">${esc(v)}</button>`).join("")}</div>`; }
function single(key,items,{cols="g2",render}={}){
  return `<div class="grid ${cols}" data-single="${key}">${items.map(it=>{const v=Array.isArray(it)?it[0]:it;return `<button type="button" class="opt" data-v="${esc(v)}" aria-pressed="${S[key]===v}">${render?render(it):`<span class="lbl">${esc(v)}</span>`}</button>`}).join("")}</div>`;
}

/* ---------- Steps ---------- */
const STEPS = [
 {id:"intro", label:"", html:()=>`
   <div class="kicker">Brief visual</div>
   <h1>Demos forma visual<br>a tu marca</h1>
   <p class="lead">Ya construimos juntos el propósito, la personalidad y la historia de tu marca. Este brief es solo para traducir todo eso a lo visual: colores, tipografías, formas y estilo.</p>
   <p class="lead">No hay respuestas correctas: elige lo que sientas que te representa. Te tomará unos <b>10 minutos</b> y tus respuestas se guardan en este dispositivo mientras avanzas.</p>
   ${q("¿Cuál es tu nombre?","",`<input class="field" data-text="nombre" value="${esc(S.nombre)}" placeholder="Tu nombre completo" autocomplete="name">`,true,"q-nombre")}
   ${q("¿Cuál es el nombre de tu marca?","Si aún no está definido, escribe el nombre de trabajo.",`<input class="field" data-text="marca" value="${esc(S.marca)}" placeholder="Nombre de la marca" autocomplete="organization">`,true,"q-marca")}
   ${q("Tu correo (opcional)","",`<input class="field" type="email" data-text="correo" value="${esc(S.correo)}" placeholder="tu@correo.com" autocomplete="email">`)}
 `, validate:()=> req("q-nombre",S.nombre.trim(),"Escribe tu nombre para continuar.") && req("q-marca",S.marca.trim(),"Escribe el nombre de tu marca.")},

 {id:"color", label:"Color", html:()=>`
   <h2>Color</h2><p class="lead">El color es lo primero que la gente recuerda de una marca.</p>
   ${q("Elige hasta 5 gamas de color que te gustaría que tu marca incluyera","Toca para seleccionar.",multi("colores",PALETTES,{max:5,cols:"g2 pal",render:p=>`${swatch(p[1])}<span class="lbl">${esc(p[0])}</span>`}),true,"q-colores")}
   ${q("¿Hay gamas de color que NO quieras en tu marca?","Opcional. Las que marques se descartarán.",multi("evitar",PALETTES,{cols:"g3",avoid:true,render:p=>`${swatch(p[1],"sm")}<span class="lbl" style="font-size:12px">${esc(p[0])}</span>`}))}
   ${q("¿Cómo te imaginas la paleta en general?","Elige hasta 2.",multi("temps",TEMPS,{max:2}))}
 `, validate:()=> req("q-colores",S.colores.length,"Elige al menos una gama de color.")},

 {id:"tipo", label:"Tipografía", html:()=>`
   <h2>Tipografía</h2><p class="lead">La forma de las letras también comunica personalidad.</p>
   ${q("Selecciona hasta 3 estilos de letra que consideres ideales para tu marca","",multi("fuentes",FONTS,{max:3,render:f=>`<div class="font-sample" style="font-family:${f[1]};${f[3]}">${esc(f[2])}</div><span class="sub">${esc(f[0])}</span>`}),true,"q-fuentes")}
 `, validate:()=> req("q-fuentes",S.fuentes.length,"Elige al menos un estilo de letra.")},

 {id:"estilo", label:"Estilo", html:()=>`
   <h2>Estilo</h2><p class="lead">¿Hacia dónde se inclina tu marca? El 3 es un punto medio.</p>
   ${q("Ubica tu marca en cada escala","",SCALES.map(s=>`<div class="scale" data-scale="${s[0]}"><div class="ends"><span>${s[1]}</span><span style="text-align:right">${s[2]}</span></div><div class="dots">${[1,2,3,4,5].map(n=>`<button type="button" class="dot" data-n="${n}" aria-pressed="${S.escalas[s[0]]==n}" aria-label="${s[1]} a ${s[2]}: ${n}">${n}</button>`).join("")}</div></div>`).join(""),true,"q-escalas")}
 `, validate:()=> req("q-escalas",SCALES.every(s=>S.escalas[s[0]]),"Responde todas las escalas para continuar.")},

 {id:"formas", label:"Formas y texturas", html:()=>`
   <h2>Formas y texturas</h2>
   ${q("¿Qué tipo de formas sientes más afines a tu marca?","Elige hasta 2.",multi("formas",SHAPES,{max:2,render:s=>`<div class="shape"><svg viewBox="0 0 120 56">${s[1]}</svg></div><span class="lbl">${esc(s[0])}</span>`}))}
   ${q("¿Qué acabados te gustan?","Elige los que quieras.",chips("acabados",FINISHES))}
 `},

 {id:"imagen", label:"Imágenes", html:()=>`
   <h2>Imágenes</h2><p class="lead">Esto nos ayuda a preparar las propuestas de moodboard.</p>
   ${q("¿Qué tipo de imágenes prefieres para tu marca?","Elige las que quieras.",multi("imagen",IMGTYPES))}
   ${q("¿Qué tipo de luz y ambiente te gusta en las imágenes?","",single("luz",LIGHTS,{render:l=>`<span class="lbl">${l[0]}</span><span class="sub">${l[1]}</span>`}))}
   ${q("¿Qué tanto deben aparecer personas en las imágenes?","",chips("personas",PEOPLE,true))}
 `},

 {id:"presencia", label:"Presencia personal", html:()=>`
   <h2>Presencia personal</h2><p class="lead">Si tú eres la cara de la marca, cuéntanos cómo te sientes cómodo apareciendo.</p>
   ${q("¿Te gustaría aparecer en la comunicación visual de tu marca?","",chips("aparecer",APPEAR,true))}
   ${q("¿En qué formatos te sentirías cómodo apareciendo?","Elige los que quieras.",chips("formatos",FORMATS))}
   ${q("¿Cómo te gustaría verte?","Elige los que quieras.",chips("verse",LOOKS))}
   ${q("¿Ya cuentas con material visual?","",chips("material",MATERIAL))}
   ${q("¿Hay algo de tu imagen personal que te gustaría que se reflejara?","Por ejemplo: tu forma de vestir, colores que usas mucho, un accesorio, un lugar.",`<textarea class="field" data-text="imagenPersonal" placeholder="Escribe aquí...">${esc(S.imagenPersonal)}</textarea>`)}
 `},

 {id:"uso", label:"Idioma y aplicaciones", html:()=>`
   <h2>Idioma y aplicaciones</h2>
   ${q("¿En qué idioma se comunicará tu marca?","",chips("idioma",LANGS,true)+`<input class="field" style="margin-top:12px;display:${S.idioma==="Otro"?"block":"none"}" id="idiomaOtro" data-text="idiomaOtro" value="${esc(S.idiomaOtro)}" placeholder="¿Cuál?">`)}
   ${q("¿Qué aplicaciones de marca necesitas?","Elige todas las que apliquen.",chips("apps",APPS)+`<input class="field" style="margin-top:12px" data-text="appsOtro" value="${esc(S.appsOtro)}" placeholder="Otras (opcional)">`)}
 `},

 {id:"cierre", label:"Para terminar", html:()=>`
   <h2>Para terminar</h2>
   ${q("¿Has visto algo visual que sientas que “eres tú”?","Una marca, un lugar, una portada, una cuenta de Instagram, una película... Puedes pegar links.",`<textarea class="field" data-text="referencias" placeholder="Escribe o pega aquí tus referencias...">${esc(S.referencias)}</textarea>`)}
   ${q("¿Algo más que quieras contarnos?","Opcional.",`<textarea class="field" data-text="comentarios" placeholder="Escribe aquí...">${esc(S.comentarios)}</textarea>`)}
 `},

 {id:"summary", label:"Resumen", html:()=>summaryHTML()}
];

function req(id,ok,msg){ const box=document.getElementById(id); const e=box&&box.querySelector(".err"); if(!ok){ if(e){e.textContent=msg;e.classList.add("show");} box&&box.scrollIntoView({behavior:"smooth",block:"center"}); return false;} if(e)e.classList.remove("show"); return true; }

/* ---------- Summary ---------- */
function list(arr,cls=""){ return arr.length?arr.map(v=>`<span class="tag ${cls}">${esc(v)}</span>`).join(""):'<span class="sum-v" style="color:#a1a1a6">—</span>'; }
function row(k,v){ return `<div class="sum-row"><span class="sum-k">${k}</span><span class="sum-v">${v}</span></div>`; }
function summaryHTML(){
  const pal = n => PALETTES.find(p=>p[0]===n);
  const fnt = n => FONTS.find(f=>f[0]===n);
  const fecha = new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
  return `
  <div class="kicker">Brief visual · Resumen</div>
  <h1>${esc(S.marca||"Tu marca")}</h1>
  <p class="lead" style="margin-top:-4px">${esc(S.nombre)}${S.correo?" · "+esc(S.correo):""} · ${fecha}</p>
  <div class="done-box no-print"><b>¡Gracias! Ya casi terminamos.</b><br>Descarga tus respuestas en PDF y envíaselas a Loreto Consultora. En tu celular, elige <b>“Guardar como PDF”</b> en la ventana que se abrirá.</div>
  <div class="sum-sec"><h4>Color</h4>
    <div>${S.colores.map(n=>`<div class="sum-pal">${swatch(pal(n)[1],"sm")}<span>${esc(n)}</span></div>`).join("")||"—"}</div>
    ${row("Evitar",list(S.evitar,"no"))}${row("Paleta en general",list(S.temps))}
  </div>
  <div class="sum-sec"><h4>Tipografía</h4>
    <div>${S.fuentes.map(n=>{const f=fnt(n);return `<span class="sum-font" style="font-family:${f[1]};${f[3]}">${esc(f[2])}</span>`}).join("")||"—"}</div>
    ${row("Estilos",list(S.fuentes))}
  </div>
  <div class="sum-sec"><h4>Estilo (1 a 5)</h4>
    ${SCALES.map(s=>row(`${s[1]} ↔ ${s[2]}`, S.escalas[s[0]]?`<b>${S.escalas[s[0]]}</b> <span style="color:#a1a1a6">/ 5</span>`:"—")).join("")}
  </div>
  <div class="sum-sec"><h4>Formas y texturas</h4>${row("Formas",list(S.formas))}${row("Acabados",list(S.acabados))}</div>
  <div class="sum-sec"><h4>Imágenes</h4>${row("Tipo",list(S.imagen))}${row("Luz y ambiente",S.luz?esc(S.luz):"—")}${row("Personas",S.personas?esc(S.personas):"—")}</div>
  <div class="sum-sec"><h4>Presencia personal</h4>${row("¿Aparecer?",S.aparecer?esc(S.aparecer):"—")}${row("Formatos",list(S.formatos))}${row("Cómo verse",list(S.verse))}${row("Material actual",list(S.material))}${row("Imagen personal",S.imagenPersonal?esc(S.imagenPersonal):"—")}</div>
  <div class="sum-sec"><h4>Idioma y aplicaciones</h4>${row("Idioma",S.idioma?esc(S.idioma==="Otro"?("Otro: "+S.idiomaOtro):S.idioma):"—")}${row("Aplicaciones",list(S.apps))}${S.appsOtro?row("Otras",esc(S.appsOtro)):""}</div>
  <div class="sum-sec"><h4>Referencias y comentarios</h4>${row("Referencias",S.referencias?esc(S.referencias).replace(/\n/g,"<br>"):"—")}${row("Comentarios",S.comentarios?esc(S.comentarios).replace(/\n/g,"<br>"):"—")}</div>
  <p class="print-only" style="font-size:11px;color:#6E6E73;margin-top:18px">Brief visual · Loreto Consultora</p>
  <div class="no-print" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px">
    <button type="button" class="btn accent" id="pdf">Descargar mis respuestas (PDF)</button>
    <button type="button" class="btn ghost" id="edit">Editar respuestas</button>
  </div>`;
}

/* ---------- Render / events ---------- */
let cur = 0;
const form = document.getElementById("form");
function render(){
  form.innerHTML = STEPS.map((s,i)=>`<section class="step ${i===cur?"active":""}" id="step-${s.id}">${i===cur?s.html():""}</section>`).join("");
  const total = STEPS.length-1;
  document.body.classList.toggle("intro", cur===0);
  document.getElementById("bar").style.width = (cur/total*100)+"%";
  document.getElementById("steplabel").textContent = cur>0 && cur<total ? `Paso ${cur} de ${total-1} · ${STEPS[cur].label}` : "";
  document.getElementById("prev").style.visibility = cur>0 ? "visible":"hidden";
  const next=document.getElementById("next");
  next.style.display = cur===total ? "none":"";
  next.textContent = cur===0 ? "Comenzar" : cur===total-1 ? "Ver resumen" : "Siguiente";
  updateCounters();
  if(cur===total){
    document.getElementById("pdf").onclick=()=>{ document.title=`Brief visual - ${S.marca||"marca"} - ${S.nombre}`; window.print(); };
    document.getElementById("edit").onclick=()=>{ cur=1; render(); window.scrollTo(0,0); };
  }
}
function updateCounters(){
  form.querySelectorAll("[data-count]").forEach(el=>{ const k=el.dataset.count; const max=+form.querySelector(`[data-multi="${k}"]`).dataset.max; el.textContent=`${S[k].length} de ${max} seleccionadas`; });
}
form.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const m=b.closest("[data-multi]"), s=b.closest("[data-single]"), sc=b.closest("[data-scale]");
  if(sc){ S.escalas[sc.dataset.scale]=+b.dataset.n; sc.querySelectorAll(".dot").forEach(d=>d.setAttribute("aria-pressed",d===b)); save(); return; }
  if(m){ const k=m.dataset.multi, max=+m.dataset.max, v=b.dataset.v, arr=S[k], i=arr.indexOf(v);
    if(i>-1) arr.splice(i,1); else { if(max && arr.length>=max){ flash(`Máximo ${max}`); return; } arr.push(v); }
    b.setAttribute("aria-pressed",i===-1); updateCounters(); save(); return; }
  if(s){ const k=s.dataset.single, v=b.dataset.v; S[k]= S[k]===v ? "" : v;
    s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",S[k]===x.dataset.v));
    if(k==="idioma"){ const o=document.getElementById("idiomaOtro"); if(o) o.style.display=S.idioma==="Otro"?"block":"none"; }
    save(); }
});
form.addEventListener("input",e=>{ const k=e.target.dataset.text; if(k){ S[k]=e.target.value; save(); } });
document.getElementById("next").onclick=()=>{ const st=STEPS[cur]; if(st.validate && !st.validate()) return; cur++; render(); window.scrollTo({top:0,behavior:"smooth"}); };
document.getElementById("prev").onclick=()=>{ if(cur>0){ cur--; render(); window.scrollTo({top:0}); } };
render();
</script>
</body>
</html>
